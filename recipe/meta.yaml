{% set version = '14.0.0.r532.gdbbc8e99d-1' %}

package:
  name: winpthreads-split
  version: {{ version.replace("-", ".") }}

source:
  - url:
      - https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-libwinpthread-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/carterbox/msys2-recipes/releases/download/20261023/mingw-w64-ucrt-x86_64-libwinpthread-{{ version }}-any.pkg.tar.zst
    sha256: caab3068ad48dbefd39d88f7ec39778d1ce452f8e7dda0670344462b598d86ec
    folder: binary-libwinpthread

  - url:
      - https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-libwinpthread-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/carterbox/msys2-recipes/releases/download/20261023/mingw-w64-clang-aarch64-libwinpthread-{{ version }}-any.pkg.tar.zst
    sha256: c9fc6a4165cfd2563c58fa8bd233f49bba9afdf25060f910d82063da981e9089
    folder: binary-libwinpthread-arm64

  - url:
      - https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-winpthreads-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/carterbox/msys2-recipes/releases/download/20261023/mingw-w64-ucrt-x86_64-winpthreads-{{ version }}-any.pkg.tar.zst
    sha256: d38f611692e8505555a78653c4eafd029bb48964e549eb7f04f37eed7bc0359a
    folder: binary-winpthreads

  - url:
      - https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-winpthreads-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/carterbox/msys2-recipes/releases/download/20261023/mingw-w64-clang-aarch64-winpthreads-{{ version }}-any.pkg.tar.zst
    sha256: 959421800305ee372568ea977d058d0ca4c54b133857240738e3585cceac0f0a
    folder: binary-winpthreads-arm64

  - url:
      # archive them for license compliance
      - https://repo.msys2.org/mingw/sources/mingw-w64-winpthreads-{{ version }}.src.tar.zst
      - https://github.com/carterbox/msys2-recipes/releases/download/20261023/mingw-w64-winpthreads-{{ version }}.src.tar.zst
    sha256: 79202508d71447ae6cb3dbd434d8045408b8ec7105e4018eb8dddff34be6ff5c
    folder: src-winpthread

build:
  number: 0
  skip: True  # [not win]

outputs:  
  - name: libwinpthread
    script: install_libwinpthread.bat
    files:
      - Library/bin/libwinpthread-1.dll
    requirements:
      run:
      run_constrained:
        - msys2-conda-epoch <0.0a0
        - pthreads-win32 <0.0a0
    test:
      commands:
        - if not exist %LIBRARY_BIN%\libwinpthread-1.dll exit 1
    about:
      home: https://mingw-w64.sourceforge.io/
      license: MIT
      license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
      summary: DLLs for MinGW-w64 winpthreads library

  - name: winpthreads
    script: install_winpthreads.bat
    files:
      - Library/lib
      - Library/include
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
      host:
        - {{ pin_subpackage("libwinpthread", exact=True) }}
      run:
        - {{ pin_subpackage("libwinpthread", exact=True) }}
      run_constrained:
        - msys2-conda-epoch <0.0a0
        - pthreads-win32 <0.0a0
    test:
      commands:
        - if not exist %LIBRARY_INC%\pthread.h exit 1
        - if not exist %LIBRARY_INC%\sched.h exit 1
        - if not exist %LIBRARY_LIB%\libpthread.dll.a exit 1
        - if not exist %LIBRARY_LIB%\pthread.lib exit 1
    about:
      home: https://mingw-w64.sourceforge.io/
      license: MIT
      license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
      summary: Development files for MinGW-w64 winpthreads library

about:
  home: https://mingw-w64.sourceforge.io/
  license: MIT
  license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
  summary: |
    Repackaged winpthreads library

extra:
  feedstock-name: winpthreads
  recipe-maintainers:
    - isuruf
